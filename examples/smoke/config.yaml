experiment:
  name: smoke
  seed: 0

codes:
  - rotated_surface

noise:
  model: code_capacity
  definition: depolarizing
  p_meas: 0 # unused at code capacity

sweeps:
  - id: threshold_sweep
    distances: [3, 5, 7, 9]
    basis: [X]
    p:
      mode: linspace
      start: 0.135
      stop: 0.15
      num: 10

  - id: suppression_sweep
    distances: [3, 5, 7, 9]
    basis: [X]
    p:
      mode: list
      values: [0.05]

sampling:
  decoder: mwpm
  max_shots: 1000000
  max_errors: 20000
  max_batch_size: 2048
  workers: 4

threshold:
  source_sweep: threshold_sweep
  distances: [3, 5, 7, 9]
  x_window: 0.1
  nu_0: 1.5

suppression:
  source_sweep: suppression_sweep
  target_pl: 1e-12

output:
  dir: results/
