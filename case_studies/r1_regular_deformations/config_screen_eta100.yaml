noise:
  model: code_capacity
  definition: biased
  params:
    eta: [100]
  p_meas: 0 # unused at code capacity

sweeps:
  - id: screen
    distances: [7, 9, 11]
    basis: [X, Z]
    p:
      mode: list
      values: [0.15]

sampling:
  decoder: bp
  max_shots: 100000
  max_errors: 3000
  max_batch_size: 2048
  workers: 4

threshold: # required by the schema; not used
  source_sweep: screen
  distances: [7, 9, 11]
  x_window: 0.1
  nu_0: 1.5

suppression: # required by the schema; not used
  source_sweep: screen
  target_pl: 1e-12

output:
  dir: case_studies/r1_regular_deformations/results/screen_eta100/
