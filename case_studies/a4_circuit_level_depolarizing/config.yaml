experiment:
  name: a4_circuit_level_depolarizing
  seed: 0

plugins: # ORourke2025's SD circuits
  - codes.py
  - noises.py

codes:
  - rotated_surface_sd

noise:
  model: circuit_level
  definition: depolarizing_sd
  p_meas: same_as_p

sweeps:
  - id: threshold_sweep
    distances: [9, 11, 13, 15, 17, 19, 21]
    rounds: 3 * d # as ORourke2025
    basis: [Z] # ORourke2025's main-text memory
    p: # ORourke2025's p near the threshold (SD_stats.pickle), for a point-by-point p_L comparison
      mode: list
      values: [0.0049, 0.005, 0.0051, 0.0052, 0.0055, 0.0056, 0.0057, 0.0058, 0.006]

  - id: suppression_sweep # required by the schema; not used
    distances: [3, 5, 7]
    basis: [Z]
    p:
      mode: list
      values: [0.003]

sampling:
  decoder: mwpm
  max_shots: 500000
  max_errors: 5000
  max_batch_size: 2048
  workers: 4

threshold:
  source_sweep: threshold_sweep
  distances: [9, 11, 13, 15, 17, 19, 21]
  x_window: 0.014 # covers every point, down to d = 21 at p = 0.0049
  nu_0: 1.06

suppression:
  source_sweep: suppression_sweep
  target_pl: 1e-12

output:
  dir: results/
