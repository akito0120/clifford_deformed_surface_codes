experiment:
  name: a4_circuit_level_depolarizing
  seed: 0

plugins: # A5's plugins for ORourke2025's SD circuits
  - ../a5_suppression_circuit_level/codes.py
  - ../a5_suppression_circuit_level/noises.py

codes:
  - rotated_surface_sd

noise:
  model: circuit_level
  definition: depolarizing_sd
  p_meas: same_as_p

sweeps:
  - id: threshold_sweep
    distances: [9, 11, 13, 15, 17, 19, 21]
    rounds: 3 * d # as ORourke2025
    basis: [Z] # ORourke2025's main-text memory
    p:
      mode: linspace
      start: 0.005
      stop: 0.0062
      num: 10

  - id: suppression_sweep # required by the schema; not used
    distances: [3, 5, 7]
    basis: [Z]
    p:
      mode: list
      values: [0.003]

sampling:
  decoder: mwpm
  max_shots: 500000
  max_errors: 5000
  max_batch_size: 2048
  workers: 4

threshold:
  source_sweep: threshold_sweep
  distances: [9, 11, 13, 15, 17, 19, 21]
  x_window: 0.012
  nu_0: 1.06

suppression:
  source_sweep: suppression_sweep
  target_pl: 1e-12

output:
  dir: results/
