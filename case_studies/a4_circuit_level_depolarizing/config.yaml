experiment:
  name: a4_circuit_level_depolarizing
  seed: 0

codes:
  - rotated_surface

noise:
  model: circuit_level
  definition: depolarizing
  p_meas: same_as_p # measurement flips with probability p, as in Stephens2014

sweeps:
  - id: threshold_sweep
    distances: [7, 9, 11, 13, 15]
    basis: [X, Z]
    p:
      mode: linspace
      start: 0.0055
      stop: 0.0085
      num: 13 # step 0.00025

  - id: suppression_sweep
    distances: [3, 5, 7]
    basis: [X]
    p:
      mode: list
      values: [0.003]

sampling:
  decoder: mwpm
  max_shots: 1000000
  max_errors: 20000
  max_batch_size: 1024
  workers: 4

threshold:
  source_sweep: threshold_sweep
  distances: [9, 11, 13, 15] # d >= 9, as in Stephens2014
  x_window: 0.015 # |p - p_th| <= 0.12% at d = 15; every point at d = 9
  nu_0: 1.06 # Stephens2014 depth-6

suppression:
  source_sweep: suppression_sweep
  target_pl: 1e-12

output:
  dir: case_study/a4_circuit_level_depolarizing/results/
