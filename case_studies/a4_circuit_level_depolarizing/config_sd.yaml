experiment:
  name: a4_circuit_level_sd
  seed: 0

plugins: # A5's plugins for ORourke2025's SD circuits
  - case_studies/a5_suppression_circuit_level/codes.py
  - case_studies/a5_suppression_circuit_level/noises.py

codes:
  - rotated_surface_sd

noise:
  model: circuit_level
  definition: depolarizing_sd
  p_meas: same_as_p # keeps the plugin's flip, 5p/3 - 4p^2/3

sweeps:
  - id: threshold_sweep
    distances: [7, 9, 11, 13, 15] # as in config.yaml
    basis: [Z] # ORourke2025's main-text memory
    p:
      mode: linspace
      start: 0.0044
      stop: 0.0068
      num: 13 # step 0.0002, centred on 0.56%

  - id: suppression_sweep # required by the schema; not used here
    distances: [3, 5, 7]
    basis: [Z]
    p:
      mode: list
      values: [0.003]

sampling:
  decoder: mwpm
  max_shots: 1000000
  max_errors: 20000
  max_batch_size: 1024
  workers: 4

threshold:
  source_sweep: threshold_sweep
  distances: [9, 11, 13, 15] # d >= 9, as in config.yaml
  x_window: 0.012 # |p - p_th| <= 0.09% at d = 15, about the same relative width as config.yaml; every point at d = 9
  nu_0: 1.06 # Stephens2014, as in config.yaml

suppression:
  source_sweep: suppression_sweep
  target_pl: 1e-12

output:
  dir: case_studies/a4_circuit_level_depolarizing/results_sd/
