experiment:
  name: smoke
  seed: 0

codes:
  - rotated_surface
  - xzzx

noise:
  model: circuit_level
  definition: biased
  params:
    eta: [0.5, 10]
  p_meas: same_as_p

sweeps:
  - id: threshold_sweep
    distances: [7, 9, 11]
    basis: [X]
    p:
      mode: window
      centers: [0.006870, 0.007214, 0.006056, 0.012295]
      step: 0.00025
      half_width: 0.003
  
  - id: suppression_sweep
    distances: [3, 5, 7, 9, 11, 13, 15, 17, 19]
    basis: [X]
    p:
      mode: list
      values: [0.001, 0.002, 0.003, 0.004]

sampling:
  decoder: mwpm
  max_shots: 100000
  max_errors: 10000
  max_batch_size: 1024
  workers: 4

threshold:
  source_sweep: threshold_sweep
  distances: [7, 9, 11]
  x_window: 0.006
  nu_0: 1.1

suppression:
  source_sweep: suppression_sweep
  target_pl: 1e-12

output:
  dir: results/smoke
  figures: false
  diagrams: false
