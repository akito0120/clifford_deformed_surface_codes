experiment:
  name: smoke
  seed: 0

codes:
  - id: css
    builder: rotated_surface
  - id: xzzx
    builder: xzzx

noise:
  model: circuit_level
  channel: biased
  params:
    eta: [0.5, 10, 100]
  p_meas: same_as_p

sweeps:
  - id: threshold_sweep
    distances: [15, 17, 19]
    basis: [X]
    p:
      mode: window
      centers: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
      step: 0.0001
      half_width: 0.003
  
  - id: suppression_sweep
    distances: [3, 5, 7, 9, 11, 13, 15, 17, 19]
    basis: [X]
    p:
      mode: list
      values: [0.01, 0.02, 0.03, 0.04]

sampling:
  decoder: mwpm
  max_shots: 300000
  max_errors: 30000
  max_batch_size: 1024
  workers: 4

output:
  dir: results/smoke
  figures: false
  diagrams: false
