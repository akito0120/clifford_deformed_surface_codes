experiment:
  name: a1_code_capacity_depolarizing
  seed: 0

codes:
  - rotated_surface
  - xzzx
  - xy

noise:
  model: code_capacity
  definition: depolarizing
  p_meas: 0 # unused at code capacity: syndrome rounds are perfect

sweeps:
  - id: threshold_sweep
    distances: [7, 11, 15, 19, 23] # Criger2018 Fig. 10
    basis: [X, Z]
    p:
      mode: linspace
      start: 0.136
      stop: 0.164
      num: 15 # step 0.002

  - id: suppression_sweep # required by the schema; not used for A1
    distances: [3, 5, 7]
    basis: [X]
    p:
      mode: list
      values: [0.05]

sampling:
  decoder: mwpm
  max_shots: 1000000
  max_errors: 20000
  max_batch_size: 1024
  workers: 4

threshold:
  source_sweep: threshold_sweep
  distances: [7, 11, 15, 19, 23]
  x_window: 0.1
  nu_0: 1.5 # literature: 1.46-1.53 at code capacity

suppression:
  source_sweep: suppression_sweep
  target_pl: 1e-12

output:
  dir: case_study/a1_code_capacity_depolarizing/results/
